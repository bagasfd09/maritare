services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maritare
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: maritare_dev
    ports:
      - "5433:5432"
    volumes:
      - maritare_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  maritare_pg:
